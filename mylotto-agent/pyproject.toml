[project]
name = "mylotto-agent"
version = "0.1.0"
description = "로또 번호 생성 & 당첨번호 수집 CLI Agent"
requires-python = ">=3.11"

[project.scripts]
lotto = "src.lotto.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/lotto/automation/*", "src/lotto/storage/s3_storage.py"]
